services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: daily-chat:${APP_VERSION}

    container_name: daily-chat-app

    ports:
      - "${APP_PORT}:80"

    # Se usati Redis o Translate diversi si possono utilizzare queste variabili.
    # environment:   
    #   REDIS_HOST: ${REDIS_HOST}
    #   REDIS_PORT: ${REDIS_PORT}
    #   TRANSLATE_HOST: ${TRANSLATE_HOST}


    networks:
      - chat-network

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:8-alpine

    container_name: daily-chat-redis

    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    networks:
      - chat-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  libretranslate:
    image: libretranslate/libretranslate:latest

    container_name: daily-chat-translate

    environment:
      LT_LOAD_ONLY: it,en,de,fr

    networks:
      - chat-network

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/languages || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


networks:

  chat-network:
    name: daily-chat-network


volumes:

  redis-data: