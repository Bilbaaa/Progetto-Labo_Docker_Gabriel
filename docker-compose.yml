services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: daily-chat:${APP_VERSION}

    container_name: daily-chat-app

    ports:
      - "${APP_PORT}:80"

    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}


    networks:
      - chat-network

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:8-alpine

    container_name: daily-chat-redis

    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    networks:
      - chat-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


networks:

  chat-network:
    name: daily-chat-network


volumes:

  redis-data: